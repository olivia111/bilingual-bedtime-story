# Render Blueprint — deploys the bilingual bedtime story app as a web service.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: bilingual-bedtime-story
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Pin the Python version Render builds with.
      - key: PYTHON_VERSION
        value: 3.10.11
      # Secrets — set their values in the Render dashboard, NOT here.
      - key: LITHOSAI_API_KEY
        sync: false
      - key: AZURE_SPEECH_KEY
        sync: false
      # Optional overrides (defaults live in app/config.py).
      - key: LITHOSAI_BASE_URL
        value: https://api.lithosai.cloud/v1
      - key: LITHOSAI_MODEL
        value: moonshotai/Kimi-K3
      # K3 thinks by default; this task does not need it.
      - key: LITHOSAI_REASONING_EFFORT
        value: low
      # Downscale uploaded page photos before sending them to the model.
      - key: IMAGE_RESIZE
        value: "true"
      - key: IMAGE_MAX_DIM
        value: "1536"
      - key: IMAGE_JPEG_QUALITY
        value: "85"
      - key: IMAGE_MAX_KB
        value: "900"
      # TTS: "azure" (native multilingual zh-CN), "gemini" (paid), or "edge" (free).
      - key: TTS_PROVIDER
        value: azure
      - key: TTS_PINYIN
        value: "false"
      - key: TTS_PAD_CHINESE
        value: "true"
      - key: AZURE_SPEECH_REGION
        value: eastus
      - key: AZURE_TTS_VOICE
        value: zh-CN-XiaoxiaoMultilingualNeural
      - key: AZURE_TTS_STYLE
        value: story
      # Gemini TTS (used only when TTS_PROVIDER=gemini).
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_TTS_MODEL
        value: gemini-2.5-flash-preview-tts
      - key: GEMINI_TTS_VOICE
        value: Kore
      # Edge fallback voice (used only when TTS_PROVIDER=edge).
      - key: TTS_VOICE
        value: en-US-AvaMultilingualNeural
      - key: RATE_LIMIT_STORY
        value: 10/minute;100/day
      - key: RATE_LIMIT_AUDIO
        value: 30/minute;300/day
